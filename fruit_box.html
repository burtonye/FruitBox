<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5d4e8f">
    <title>Fruit Box - Offline</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cell-size: 50px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: calc(20px + env(safe-area-inset-top))
                calc(20px + env(safe-area-inset-right))
                calc(20px + env(safe-area-inset-bottom))
                calc(20px + env(safe-area-inset-left));
            user-select: none;
        }

        h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }

        .game-info {
            display: flex;
            gap: 30px;
            margin-bottom: 15px;
            color: white;
            font-size: 18px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .game-info span {
            background: rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 20px;
        }

        .game-info .timer {
            font-variant-numeric: tabular-nums;
        }

        .game-info .timer.warning {
            background: rgba(231, 76, 60, 0.6);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .controls {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            transition: transform 0.1s, background 0.2s;
        }

        button:hover {
            background: #45a049;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        .game-container {
            position: relative;
            background: #8B4513;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 100%;
            touch-action: none;
        }

        .game-board {
            display: grid;
            gap: 5px;
            background: #654321;
            padding: 10px;
            border-radius: 10px;
            position: relative;
            touch-action: none;
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .apple {
            width: calc(var(--cell-size) - 6px);
            height: calc(var(--cell-size) - 6px);
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #c0392b);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(var(--cell-size) * 0.4);
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            position: relative;
            cursor: pointer;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .apple::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 10px;
            background: #5d4e37;
            border-radius: 2px;
        }

        .apple::after {
            content: '';
            position: absolute;
            top: -6px;
            left: 55%;
            width: 10px;
            height: 8px;
            background: #27ae60;
            border-radius: 50% 50% 50% 0;
            transform: rotate(45deg);
        }

        .apple.selected {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(255,255,0,0.8);
        }

        .apple.removed {
            animation: pop 0.3s ease-out forwards;
        }

        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.5; }
            100% { transform: scale(0); opacity: 0; }
        }

        .cell.empty {
            /* No background - invisible when apple is removed */
        }

        .selection-box {
            position: fixed;
            border: 3px dashed #FFD700;
            background: rgba(255, 215, 0, 0.2);
            pointer-events: none;
            z-index: 1000;
            border-radius: 5px;
            display: none;
        }

        .instructions {
            color: white;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            opacity: 0.9;
            max-width: 480px;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        .overlay h2 {
            color: white;
            font-size: clamp(32px, 6vw, 48px);
            margin-bottom: 20px;
        }

        .overlay p {
            color: white;
            font-size: clamp(18px, 4vw, 24px);
            margin-bottom: 30px;
        }

        .current-selection {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 18px;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 1001;
        }

        .current-selection.show {
            opacity: 1;
        }

        /* Start Screen Styles */
        .start-screen {
            text-align: center;
        }

        .start-screen h2 {
            font-size: clamp(36px, 7vw, 56px);
            margin-bottom: 10px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.4);
        }

        .start-screen .subtitle {
            font-size: clamp(16px, 3.5vw, 20px);
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .target-selector {
            margin-bottom: 40px;
            text-align: center;
        }

        .target-selector label {
            display: block;
            color: white;
            font-size: clamp(18px, 4vw, 22px);
            margin-bottom: 20px;
            text-align: center;
        }

        .target-input {
            width: 150px;
            height: 80px;
            font-size: clamp(32px, 7vw, 48px);
            font-weight: bold;
            text-align: center;
            border: 3px solid #FFD700;
            border-radius: 15px;
            background: rgba(255,255,255,0.1);
            color: #FFD700;
            outline: none;
            transition: all 0.2s;
        }

        .target-input:focus {
            background: rgba(255,255,255,0.2);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        .target-input::placeholder {
            color: rgba(255, 215, 0, 0.5);
        }

        .target-hint {
            margin-top: 10px;
            color: rgba(255,255,255,0.6);
            font-size: 14px;
        }

        .start-btn {
            font-size: clamp(18px, 4vw, 24px);
            padding: 14px 40px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border-radius: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .start-btn:hover {
            transform: scale(1.08);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 28px;
            }

            .game-info {
                gap: 12px;
                font-size: 16px;
            }

            .controls {
                flex-wrap: wrap;
                justify-content: center;
            }

            button {
                padding: 12px 18px;
                font-size: 15px;
            }

            .target-input {
                width: 140px;
                height: 70px;
            }
        }
    </style>
</head>
<body>
    <h1>Fruit Box</h1>
    <div class="game-info">
        <span>Score: <strong id="score">0</strong></span>
        <span>Target: <strong id="target-display">10</strong></span>
        <span class="timer">Time: <strong id="timer-display">2:00</strong></span>
        <span>Apples Left: <strong id="apples-left">0</strong></span>
    </div>
    <div class="controls">
        <button onclick="showStartScreen()">New Game</button>
        <button onclick="checkForMoves()">Check Moves</button>
    </div>
    <div class="game-container" id="game-container">
        <div class="game-board" id="game-board"></div>
    </div>
    <div class="instructions" id="instructions">
        Drag to select apples that sum to exactly 10. Get 1 point per apple!
    </div>

    <!-- Selection box (now in body for free positioning) -->
    <div class="selection-box" id="selection-box"></div>

    <div class="current-selection" id="current-selection">Sum: 0</div>

    <!-- Start Screen -->
    <div class="overlay show" id="start-screen">
        <div class="start-screen">
            <h2>Fruit Box</h2>
            <p class="subtitle">Select apples that add up to your target number!</p>

            <div class="target-selector">
                <label>Enter your target sum (1-100):</label>
                <input type="number" class="target-input" id="target-input" value="10" min="1" max="100">
                <p class="target-hint">You have 120 seconds to score as many points as possible!</p>
            </div>

            <button class="start-btn" onclick="startGame()">Start Game</button>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div class="overlay" id="game-over">
        <h2 id="game-over-title">Game Over!</h2>
        <p>Final Score: <span id="final-score">0</span></p>
        <button onclick="showStartScreen()">Play Again</button>
    </div>

    <script>
        const ROWS = 10;
        const COLS = 17;
        const GAME_DURATION = 120; // seconds

        let board = [];
        let score = 0;
        let targetSum = 10;
        let timeRemaining = GAME_DURATION;
        let timerInterval = null;
        let isSelecting = false;
        let startX = 0;
        let startY = 0;
        let selectedCells = [];
        let appleElements = [];

        const gameBoard = document.getElementById('game-board');
        const gameContainer = document.getElementById('game-container');
        const selectionBox = document.getElementById('selection-box');
        const scoreDisplay = document.getElementById('score');
        const targetDisplayGame = document.getElementById('target-display');
        const timerDisplay = document.getElementById('timer-display');
        const applesLeftDisplay = document.getElementById('apples-left');
        const currentSelectionDisplay = document.getElementById('current-selection');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over');
        const gameOverTitle = document.getElementById('game-over-title');
        const finalScoreDisplay = document.getElementById('final-score');
        const instructionsDisplay = document.getElementById('instructions');
        const targetInput = document.getElementById('target-input');
        const rootStyle = document.documentElement.style;

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function updateTimerDisplay() {
            timerDisplay.textContent = formatTime(timeRemaining);
            const timerSpan = timerDisplay.closest('span');
            if (timeRemaining <= 10) {
                timerSpan.classList.add('warning');
            } else {
                timerSpan.classList.remove('warning');
            }
        }

        function startTimer() {
            stopTimer();
            timeRemaining = GAME_DURATION;
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();

                if (timeRemaining <= 0) {
                    stopTimer();
                    endGame("Time's Up!");
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function showStartScreen() {
            stopTimer();
            gameOverScreen.classList.remove('show');
            startScreen.classList.add('show');
            targetInput.focus();
        }

        function startGame() {
            // Get target from input
            let inputValue = parseInt(targetInput.value);
            if (isNaN(inputValue) || inputValue < 1) inputValue = 1;
            if (inputValue > 100) inputValue = 100;
            targetSum = inputValue;
            targetInput.value = targetSum;

            startScreen.classList.remove('show');
            targetDisplayGame.textContent = targetSum;
            instructionsDisplay.textContent = `Drag to select apples that sum to exactly ${targetSum}. Get 1 point per apple!`;
            newGame();
            startTimer();
        }

        function generateBoard() {
            board = [];
            // Determine max apple value based on target
            const maxValue = Math.min(9, targetSum - 1);

            for (let r = 0; r < ROWS; r++) {
                board[r] = [];
                for (let c = 0; c < COLS; c++) {
                    // Generate numbers 1 to maxValue
                    const num = Math.floor(Math.random() * maxValue) + 1;
                    board[r][c] = num;
                }
            }
        }

        function renderBoard() {
            updateLayout();
            gameBoard.style.gridTemplateColumns = `repeat(${COLS}, var(--cell-size))`;
            gameBoard.innerHTML = '';
            appleElements = [];

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;

                    if (board[r][c] !== null) {
                        const apple = document.createElement('div');
                        apple.className = 'apple';
                        apple.textContent = board[r][c];
                        apple.dataset.row = r;
                        apple.dataset.col = c;
                        apple.dataset.value = board[r][c];
                        cell.appendChild(apple);
                    } else {
                        cell.classList.add('empty');
                    }

                    gameBoard.appendChild(cell);
                }
            }

            // After rendering, cache apple positions
            requestAnimationFrame(() => {
                cacheApplePositions();
            });

            updateApplesLeft();
        }

        function updateLayout() {
            const containerStyles = getComputedStyle(gameContainer);
            const paddingX = parseFloat(containerStyles.paddingLeft) + parseFloat(containerStyles.paddingRight);
            const paddingY = parseFloat(containerStyles.paddingTop) + parseFloat(containerStyles.paddingBottom);
            const boardStyles = getComputedStyle(gameBoard);
            const boardPaddingX = parseFloat(boardStyles.paddingLeft) + parseFloat(boardStyles.paddingRight);
            const boardPaddingY = parseFloat(boardStyles.paddingTop) + parseFloat(boardStyles.paddingBottom);

            const maxWidth = gameContainer.clientWidth - paddingX - boardPaddingX;
            const topOffset = gameContainer.getBoundingClientRect().top;
            const availableHeight = window.innerHeight - topOffset - paddingY - boardPaddingY - 30;
            const maxHeight = Math.max(availableHeight, 200);

            const widthBased = Math.floor(maxWidth / COLS);
            const heightBased = Math.floor(maxHeight / ROWS);
            const cellSize = Math.max(28, Math.min(60, Math.min(widthBased, heightBased)));

            rootStyle.setProperty('--cell-size', `${cellSize}px`);
            gameBoard.style.width = `${cellSize * COLS}px`;
            gameBoard.style.height = `${cellSize * ROWS}px`;
        }

        function cacheApplePositions() {
            appleElements = [];
            document.querySelectorAll('.apple').forEach(apple => {
                const rect = apple.getBoundingClientRect();
                appleElements.push({
                    element: apple,
                    row: parseInt(apple.dataset.row),
                    col: parseInt(apple.dataset.col),
                    value: parseInt(apple.dataset.value),
                    centerX: rect.left + rect.width / 2,
                    centerY: rect.top + rect.height / 2,
                    rect: rect
                });
            });
        }

        function updateApplesLeft() {
            let count = 0;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (board[r][c] !== null) count++;
                }
            }
            applesLeftDisplay.textContent = count;
            return count;
        }

        function getEnclosedApples(x1, y1, x2, y2) {
            const minX = Math.min(x1, x2);
            const maxX = Math.max(x1, x2);
            const minY = Math.min(y1, y2);
            const maxY = Math.max(y1, y2);

            const enclosed = [];

            appleElements.forEach(apple => {
                // Check if apple center is within the selection box
                if (apple.centerX >= minX && apple.centerX <= maxX &&
                    apple.centerY >= minY && apple.centerY <= maxY) {
                    enclosed.push(apple);
                }
            });

            return enclosed;
        }

        function updateSelectionBox(x1, y1, x2, y2) {
            const minX = Math.min(x1, x2);
            const maxX = Math.max(x1, x2);
            const minY = Math.min(y1, y2);
            const maxY = Math.max(y1, y2);

            selectionBox.style.left = `${minX}px`;
            selectionBox.style.top = `${minY}px`;
            selectionBox.style.width = `${maxX - minX}px`;
            selectionBox.style.height = `${maxY - minY}px`;
            selectionBox.style.display = 'block';
        }

        function highlightApples(apples) {
            // Remove previous highlights
            document.querySelectorAll('.apple.selected').forEach(el => {
                el.classList.remove('selected');
            });

            // Add new highlights
            apples.forEach(apple => {
                apple.element.classList.add('selected');
            });
        }

        function calculateSum(apples) {
            return apples.reduce((sum, apple) => sum + apple.value, 0);
        }

        function removeApples(apples) {
            apples.forEach(apple => {
                apple.element.classList.add('removed');
                board[apple.row][apple.col] = null;
            });

            setTimeout(() => {
                renderBoard();
            }, 300);
        }

        function showFeedback(sum, valid, count) {
            currentSelectionDisplay.textContent = valid ? `+${count} points!` : `Sum: ${sum} (need ${targetSum})`;
            currentSelectionDisplay.className = 'current-selection show';

            setTimeout(() => {
                currentSelectionDisplay.classList.remove('show');
            }, 1000);
        }

        function checkForMoves() {
            // Re-cache positions in case of scroll/resize
            cacheApplePositions();

            // Check all possible rectangular selections
            const apples = appleElements.slice();
            const n = apples.length;

            // Try all combinations of apples that could form a rectangle
            for (let i = 0; i < n; i++) {
                for (let j = i; j < n; j++) {
                    // Define a rectangle from apple i to apple j bounds
                    const minX = Math.min(apples[i].centerX, apples[j].centerX) - 1;
                    const maxX = Math.max(apples[i].centerX, apples[j].centerX) + 1;
                    const minY = Math.min(apples[i].centerY, apples[j].centerY) - 1;
                    const maxY = Math.max(apples[i].centerY, apples[j].centerY) + 1;

                    const enclosed = getEnclosedApples(minX, minY, maxX, maxY);
                    if (enclosed.length > 0 && calculateSum(enclosed) === targetSum) {
                        alert('There are still valid moves available!');
                        return true;
                    }
                }
            }

            alert('No more valid moves. Game Over!');
            endGame('No More Moves!');
            return false;
        }

        function endGame(reason = 'Game Over!') {
            stopTimer();
            gameOverTitle.textContent = reason;
            finalScoreDisplay.textContent = score;
            gameOverScreen.classList.add('show');
        }

        function newGame() {
            score = 0;
            scoreDisplay.textContent = score;
            gameOverScreen.classList.remove('show');
            generateBoard();
            renderBoard();
        }

        let activePointerId = null;

        function shouldIgnoreTarget(target) {
            return target.closest('button') || target.closest('.overlay.show') || target.closest('input');
        }

        function startSelection(clientX, clientY) {
            isSelecting = true;
            startX = clientX;
            startY = clientY;

            cacheApplePositions();

            updateSelectionBox(startX, startY, startX, startY);
            currentSelectionDisplay.textContent = 'Sum: 0';
            currentSelectionDisplay.classList.add('show');
        }

        function updateSelection(clientX, clientY) {
            updateSelectionBox(startX, startY, clientX, clientY);

            selectedCells = getEnclosedApples(startX, startY, clientX, clientY);
            highlightApples(selectedCells);

            const sum = calculateSum(selectedCells);
            currentSelectionDisplay.textContent = `Sum: ${sum}`;
            if (sum === targetSum) {
                currentSelectionDisplay.style.color = '#2ecc71';
            } else if (sum > targetSum) {
                currentSelectionDisplay.style.color = '#e74c3c';
            } else {
                currentSelectionDisplay.style.color = 'white';
            }
        }

        function finishSelection() {
            if (!isSelecting) return;
            isSelecting = false;

            selectionBox.style.display = 'none';
            document.querySelectorAll('.apple.selected').forEach(el => {
                el.classList.remove('selected');
            });

            if (selectedCells.length > 0) {
                const sum = calculateSum(selectedCells);
                if (sum === targetSum) {
                    score += selectedCells.length;
                    scoreDisplay.textContent = score;
                    showFeedback(sum, true, selectedCells.length);
                    removeApples(selectedCells);
                } else {
                    showFeedback(sum, false, selectedCells.length);
                }
            }

            currentSelectionDisplay.style.color = 'white';
            setTimeout(() => {
                if (!isSelecting) {
                    currentSelectionDisplay.classList.remove('show');
                }
            }, 1000);

            selectedCells = [];
        }

        document.addEventListener('pointerdown', (e) => {
            if (shouldIgnoreTarget(e.target)) {
                return;
            }

            if (e.pointerType === 'mouse' && e.button !== 0) {
                return;
            }

            e.preventDefault();
            activePointerId = e.pointerId;
            if (e.target.setPointerCapture) {
                e.target.setPointerCapture(e.pointerId);
            }
            startSelection(e.clientX, e.clientY);
        }, { passive: false });

        document.addEventListener('pointermove', (e) => {
            if (!isSelecting || activePointerId !== e.pointerId) return;
            e.preventDefault();
            updateSelection(e.clientX, e.clientY);
        }, { passive: false });

        document.addEventListener('pointerup', (e) => {
            if (activePointerId !== e.pointerId) return;
            if (e.target.releasePointerCapture) {
                e.target.releasePointerCapture(e.pointerId);
            }
            finishSelection();
            activePointerId = null;
        });

        document.addEventListener('pointercancel', (e) => {
            if (activePointerId !== e.pointerId) return;
            finishSelection();
            activePointerId = null;
        });

        // Handle window resize - update cached positions
        window.addEventListener('resize', () => {
            if (appleElements.length > 0) {
                updateLayout();
                cacheApplePositions();
            }
        });

        // Handle scroll - update cached positions
        window.addEventListener('scroll', () => {
            if (appleElements.length > 0) {
                cacheApplePositions();
            }
        });

        // Allow Enter key to start game from input
        targetInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                startGame();
            }
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</body>
</html>
