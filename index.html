<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1f5f3b">
    <title>Fruit Box - Offline</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cell-size: 50px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1f5f3b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: calc(20px + env(safe-area-inset-top))
                calc(20px + env(safe-area-inset-right))
                calc(20px + env(safe-area-inset-bottom))
                calc(20px + env(safe-area-inset-left));
            user-select: none;
        }

        h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 10px;
            font-size: clamp(28px, 5vw, 42px);
        }

        .game-info {
            display: flex;
            gap: 30px;
            margin-bottom: 15px;
            color: white;
            font-size: clamp(16px, 3vw, 18px);
            flex-wrap: wrap;
            justify-content: center;
        }

        .game-info span {
            background: rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 20px;
        }

        .controls {
            margin-bottom: 15px;
            display: flex;
            gap: 12px;
            align-items: center;
            color: white;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 10px 20px;
            font-size: clamp(14px, 2.5vw, 16px);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            transition: transform 0.1s, background 0.2s;
        }

        button:hover {
            background: #45a049;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        .game-container {
            position: relative;
            background: #8B4513;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 100%;
            margin-bottom: 20px;
        }

        .game-board {
            display: grid;
            gap: 5px;
            background: #654321;
            padding: 10px;
            border-radius: 10px;
            position: relative;
            touch-action: none;
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .apple {
            width: calc(var(--cell-size) - 6px);
            height: calc(var(--cell-size) - 6px);
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #c0392b);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(var(--cell-size) * 0.4);
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            position: relative;
            cursor: pointer;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .apple::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 10px;
            background: #5d4e37;
            border-radius: 2px;
        }

        .apple::after {
            content: '';
            position: absolute;
            top: -6px;
            left: 55%;
            width: 10px;
            height: 8px;
            background: #27ae60;
            border-radius: 50% 50% 50% 0;
            transform: rotate(45deg);
        }

        .apple.selected {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(255,255,0,0.8);
        }

        .apple.removed {
            animation: pop 0.3s ease-out forwards;
        }

        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.5; }
            100% { transform: scale(0); opacity: 0; }
        }

        .cell.empty {
            /* No background - invisible when apple is removed */
        }

        .selection-box {
            position: fixed;
            border: 3px dashed #FFD700;
            background: rgba(255, 215, 0, 0.2);
            pointer-events: none;
            z-index: 1000;
            border-radius: 5px;
            display: none;
        }

        .instructions {
            color: white;
            text-align: center;
            margin-top: 20px;
            margin-bottom: 20px;
            font-size: clamp(12px, 2.5vw, 14px);
            opacity: 0.9;
            max-width: 480px;
        }

        .current-selection {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: clamp(16px, 3vw, 18px);
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 1001;
        }

        .current-selection.show {
            opacity: 1;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 1200;
            padding: 20px;
        }

        .overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay-content {
            background: rgba(31, 95, 59, 0.95);
            color: white;
            border-radius: 16px;
            padding: 24px 32px;
            text-align: center;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
        }

        .overlay-content h2 {
            font-size: clamp(24px, 4vw, 32px);
            margin-bottom: 12px;
        }

        .overlay-content p {
            margin-bottom: 20px;
            font-size: clamp(14px, 3vw, 18px);
        }

        .target-input {
            width: 90px;
            height: 40px;
            font-size: clamp(18px, 3vw, 20px);
            font-weight: bold;
            text-align: center;
            border: 2px solid #FFD700;
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
            color: #FFD700;
            outline: none;
        }

        .light-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: clamp(12px, 2.5vw, 14px);
        }

        body.light-colors {
            background: #4c8b64;
        }

        body.light-colors .game-container {
            background: #a87345;
        }

        body.light-colors .game-board {
            background: #8b5a2b;
        }

        body.light-colors .apple {
            background: radial-gradient(circle at 30% 30%, #ffb3b3, #e57373);
        }

        @media (max-width: 600px) {
            .game-info {
                gap: 12px;
            }

            .controls {
                gap: 8px;
            }

            button {
                padding: 8px 16px;
            }

            .target-input {
                width: 80px;
                height: 38px;
            }
        }
    </style>
</head>
<body>
    <h1>Fruit Box</h1>
    <div class="game-info">
        <span>Score: <strong id="score">0</strong></span>
        <span>Target: <strong id="target-display">10</strong></span>
        <span>Layout: <strong id="layout-display">10×17</strong></span>
        <span>Apples Left: <strong id="apples-left">0</strong></span>
        <span>Time: <strong id="time-remaining">120</strong></span>
    </div>
    <div class="controls">
        <label>Target</label>
        <input type="number" class="target-input" id="target-input" value="10" min="1" max="100">
        <button onclick="startGame()">New Game</button>
        <button id="bgm-toggle" type="button">Music: On</button>
        <label class="light-toggle">
            <input type="checkbox" id="light-toggle">
            Light Colors
        </label>
        <label class="light-toggle">
            <input type="checkbox" id="compact-toggle">
            Compact Board
        </label>
    </div>
    <div class="game-container" id="game-container">
        <div class="game-board" id="game-board"></div>
    </div>
    <div class="instructions" id="instructions">
        Drag to select apples that sum to exactly 10. Get 1 point per apple!
    </div>

    <!-- Selection box -->
    <div class="selection-box" id="selection-box"></div>

    <div class="current-selection" id="current-selection">Sum: 0</div>

    <div class="overlay" id="overlay">
        <div class="overlay-content">
            <h2 id="overlay-title">You Win!</h2>
            <p id="overlay-message">Great job! Your score: 0</p>
            <button id="overlay-restart">Play Again</button>
        </div>
    </div>

    <audio id="bgm" src="3.mp3"></audio>

    <script>
        const DEFAULT_LAYOUT = { rows: 10, cols: 17 };
        const COMPACT_LAYOUT = { rows: 8, cols: 12 };
        let ROWS = DEFAULT_LAYOUT.rows;
        let COLS = DEFAULT_LAYOUT.cols;
        const TIME_LIMIT_SECONDS = 120;

        let board = [];
        let score = 0;
        let targetSum = 10;
        let isSelecting = false;
        let startX = 0;
        let startY = 0;
        let selectedCells = [];
        let appleElements = [];
        let activePointerId = null;
        let gameOver = false;
        let timerInterval = null;
        let timeStart = null;
        let bgmEnabled = true;

        const gameBoard = document.getElementById('game-board');
        const gameContainer = document.getElementById('game-container');
        const selectionBox = document.getElementById('selection-box');
        const scoreDisplay = document.getElementById('score');
        const targetDisplayGame = document.getElementById('target-display');
        const applesLeftDisplay = document.getElementById('apples-left');
        const currentSelectionDisplay = document.getElementById('current-selection');
        const instructionsDisplay = document.getElementById('instructions');
        const targetInput = document.getElementById('target-input');
        const lightToggle = document.getElementById('light-toggle');
        const compactToggle = document.getElementById('compact-toggle');
        const timeRemainingDisplay = document.getElementById('time-remaining');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayMessage = document.getElementById('overlay-message');
        const overlayRestart = document.getElementById('overlay-restart');
        const bgm = document.getElementById('bgm');
        const bgmToggle = document.getElementById('bgm-toggle');
        const rootStyle = document.documentElement.style;
        const layoutDisplay = document.getElementById('layout-display');

        function startGame() {
            // Get target from input
            let inputValue = parseInt(targetInput.value);
            if (isNaN(inputValue) || inputValue < 1) inputValue = 1;
            if (inputValue > 100) inputValue = 100;
            targetSum = inputValue;
            targetInput.value = targetSum;

            targetDisplayGame.textContent = targetSum;
            instructionsDisplay.textContent = `Drag to select apples that sum to exactly ${targetSum}. Get 1 point per apple!`;
            newGame();
        }

        function updateLayoutDisplay() {
            layoutDisplay.textContent = `${ROWS}×${COLS}`;
        }

        function setLayout(isCompact, { restart = true } = {}) {
            const layout = isCompact ? COMPACT_LAYOUT : DEFAULT_LAYOUT;
            ROWS = layout.rows;
            COLS = layout.cols;
            updateLayoutDisplay();
            if (restart) {
                startGame();
                return;
            }
            updateLayout();
        }

        function updateLayout() {
            const containerStyles = getComputedStyle(gameContainer);
            const paddingX = parseFloat(containerStyles.paddingLeft) + parseFloat(containerStyles.paddingRight);
            const paddingY = parseFloat(containerStyles.paddingTop) + parseFloat(containerStyles.paddingBottom);
            const boardStyles = getComputedStyle(gameBoard);
            const boardPaddingX = parseFloat(boardStyles.paddingLeft) + parseFloat(boardStyles.paddingRight);
            const boardPaddingY = parseFloat(boardStyles.paddingTop) + parseFloat(boardStyles.paddingBottom);

            // Get grid gap from computed styles
            const gridGap = parseFloat(boardStyles.gap) || 5;

            const maxWidth = window.innerWidth - paddingX - boardPaddingX - 40;
            const topOffset = gameContainer.getBoundingClientRect().top;

            // Measure actual instructions element height
            const instructionsRect = instructionsDisplay.getBoundingClientRect();
            const instructionsHeight = instructionsRect.height || 50;
            const instructionsMargin = 40; // margin-top + margin-bottom
            const gameContainerMargin = 20; // margin-bottom on game-container

            const bottomPadding = 40;
            const totalBottomReserve = instructionsHeight + instructionsMargin + gameContainerMargin + bottomPadding;
            const availableHeight = window.innerHeight - topOffset - paddingY - boardPaddingY - totalBottomReserve;
            const maxHeight = Math.max(availableHeight, 200);

            // Account for grid gaps when calculating cell size
            const totalGapWidth = gridGap * (COLS - 1);
            const totalGapHeight = gridGap * (ROWS - 1);

            const widthBased = Math.floor((maxWidth - totalGapWidth) / COLS);
            const heightBased = Math.floor((maxHeight - totalGapHeight) / ROWS);
            const cellSize = Math.max(28, Math.min(60, Math.min(widthBased, heightBased)));

            rootStyle.setProperty('--cell-size', `${cellSize}px`);
            gameBoard.style.width = `${cellSize * COLS + totalGapWidth}px`;
            gameBoard.style.height = `${cellSize * ROWS + totalGapHeight}px`;
        }

        function generateBoard() {
            board = [];
            // Determine max apple value based on target
            const maxValue = Math.min(9, targetSum - 1);

            for (let r = 0; r < ROWS; r++) {
                board[r] = [];
                for (let c = 0; c < COLS; c++) {
                    // Generate numbers 1 to maxValue
                    const num = Math.floor(Math.random() * maxValue) + 1;
                    board[r][c] = num;
                }
            }
        }

        function renderBoard() {
            updateLayout();
            gameBoard.style.gridTemplateColumns = `repeat(${COLS}, var(--cell-size))`;
            gameBoard.innerHTML = '';
            appleElements = [];

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;

                    if (board[r][c] !== null) {
                        const apple = document.createElement('div');
                        apple.className = 'apple';
                        apple.textContent = board[r][c];
                        apple.dataset.row = r;
                        apple.dataset.col = c;
                        apple.dataset.value = board[r][c];
                        cell.appendChild(apple);
                    } else {
                        cell.classList.add('empty');
                    }

                    gameBoard.appendChild(cell);
                }
            }

            // After rendering, cache apple positions
            requestAnimationFrame(() => {
                cacheApplePositions();
            });

            checkGameState();
        }

        function cacheApplePositions() {
            appleElements = [];
            document.querySelectorAll('.apple').forEach(apple => {
                const rect = apple.getBoundingClientRect();
                appleElements.push({
                    element: apple,
                    row: parseInt(apple.dataset.row),
                    col: parseInt(apple.dataset.col),
                    value: parseInt(apple.dataset.value),
                    centerX: rect.left + rect.width / 2,
                    centerY: rect.top + rect.height / 2,
                    rect: rect
                });
            });
        }

        function updateApplesLeft() {
            let count = 0;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (board[r][c] !== null) count++;
                }
            }
            applesLeftDisplay.textContent = count;
            return count;
        }

        function checkForMoves() {
            const prefix = Array.from({ length: ROWS + 1 }, () => Array(COLS + 1).fill(0));

            for (let r = 1; r <= ROWS; r++) {
                for (let c = 1; c <= COLS; c++) {
                    const value = board[r - 1][c - 1] ?? 0;
                    prefix[r][c] = value + prefix[r - 1][c] + prefix[r][c - 1] - prefix[r - 1][c - 1];
                }
            }

            for (let top = 0; top < ROWS; top++) {
                for (let bottom = top; bottom < ROWS; bottom++) {
                    for (let left = 0; left < COLS; left++) {
                        for (let right = left; right < COLS; right++) {
                            const sum = prefix[bottom + 1][right + 1]
                                - prefix[top][right + 1]
                                - prefix[bottom + 1][left]
                                + prefix[top][left];
                            if (sum === targetSum) {
                                return true;
                            }
                            if (sum > targetSum) {
                                break;
                            }
                        }
                    }
                }
            }

            return false;
        }

        function getEnclosedApples(x1, y1, x2, y2) {
            const minX = Math.min(x1, x2);
            const maxX = Math.max(x1, x2);
            const minY = Math.min(y1, y2);
            const maxY = Math.max(y1, y2);

            const enclosed = [];

            appleElements.forEach(apple => {
                // Check if apple center is within the selection box
                if (apple.centerX >= minX && apple.centerX <= maxX &&
                    apple.centerY >= minY && apple.centerY <= maxY) {
                    enclosed.push(apple);
                }
            });

            return enclosed;
        }

        function updateSelectionBox(x1, y1, x2, y2) {
            const minX = Math.min(x1, x2);
            const maxX = Math.max(x1, x2);
            const minY = Math.min(y1, y2);
            const maxY = Math.max(y1, y2);

            selectionBox.style.left = `${minX}px`;
            selectionBox.style.top = `${minY}px`;
            selectionBox.style.width = `${maxX - minX}px`;
            selectionBox.style.height = `${maxY - minY}px`;
            selectionBox.style.display = 'block';
        }

        function highlightApples(apples) {
            // Remove previous highlights
            document.querySelectorAll('.apple.selected').forEach(el => {
                el.classList.remove('selected');
            });

            // Add new highlights
            apples.forEach(apple => {
                apple.element.classList.add('selected');
            });
        }

        function calculateSum(apples) {
            return apples.reduce((sum, apple) => sum + apple.value, 0);
        }

        function removeApples(apples) {
            apples.forEach(apple => {
                apple.element.classList.add('removed');
                board[apple.row][apple.col] = null;
            });

            setTimeout(() => {
                renderBoard();
            }, 300);
        }

        function showFeedback(sum, valid, count) {
            currentSelectionDisplay.textContent = valid ? `+${count} points!` : `Sum: ${sum} (need ${targetSum})`;
            currentSelectionDisplay.className = 'current-selection show';

            setTimeout(() => {
                currentSelectionDisplay.classList.remove('show');
            }, 1000);
        }

        function newGame() {
            score = 0;
            scoreDisplay.textContent = score;
            gameOver = false;
            hideOverlay();
            do {
                generateBoard();
            } while (!checkForMoves());
            renderBoard();
            startTimer();
        }

        function shouldIgnoreTarget(target) {
            return target.closest('button') || target.closest('input') || target.closest('label');
        }

        function startSelection(clientX, clientY) {
            if (gameOver) return;
            isSelecting = true;
            startX = clientX;
            startY = clientY;

            cacheApplePositions();

            updateSelectionBox(startX, startY, startX, startY);
            currentSelectionDisplay.textContent = 'Sum: 0';
            currentSelectionDisplay.classList.add('show');
        }

        function updateSelection(clientX, clientY) {
            updateSelectionBox(startX, startY, clientX, clientY);

            selectedCells = getEnclosedApples(startX, startY, clientX, clientY);
            highlightApples(selectedCells);

            const sum = calculateSum(selectedCells);
            currentSelectionDisplay.textContent = `Sum: ${sum}`;
            if (sum === targetSum) {
                currentSelectionDisplay.style.color = '#2ecc71';
            } else if (sum > targetSum) {
                currentSelectionDisplay.style.color = '#e74c3c';
            } else {
                currentSelectionDisplay.style.color = 'white';
            }
        }

        function finishSelection() {
            if (!isSelecting || gameOver) return;
            isSelecting = false;

            selectionBox.style.display = 'none';
            document.querySelectorAll('.apple.selected').forEach(el => {
                el.classList.remove('selected');
            });

            if (selectedCells.length > 0) {
                const sum = calculateSum(selectedCells);
                if (sum === targetSum) {
                    score += selectedCells.length;
                    scoreDisplay.textContent = score;
                    showFeedback(sum, true, selectedCells.length);
                    removeApples(selectedCells);
                } else {
                    showFeedback(sum, false, selectedCells.length);
                }
            }

            currentSelectionDisplay.style.color = 'white';
            setTimeout(() => {
                if (!isSelecting) {
                    currentSelectionDisplay.classList.remove('show');
                }
            }, 1000);

            selectedCells = [];
        }

        function showOverlay(title, message) {
            overlayTitle.textContent = title;
            overlayMessage.textContent = message;
            overlay.classList.add('show');
        }

        function hideOverlay() {
            overlay.classList.remove('show');
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function updateTimeDisplay(seconds) {
            timeRemainingDisplay.textContent = String(seconds);
        }

        function startTimer() {
            stopTimer();
            timeStart = Date.now();
            updateTimeDisplay(TIME_LIMIT_SECONDS);
            timerInterval = setInterval(() => {
                const elapsedSeconds = Math.floor((Date.now() - timeStart) / 1000);
                const remaining = Math.max(0, TIME_LIMIT_SECONDS - elapsedSeconds);
                updateTimeDisplay(remaining);
                if (remaining <= 0) {
                    handleGameOver('time');
                }
            }, 250);
        }

        function handleVictory() {
            if (gameOver) return;
            gameOver = true;
            stopTimer();
            showOverlay('You Win!', `Great job! Your score: ${score}`);
        }

        function handleGameOver(reason) {
            if (gameOver) return;
            gameOver = true;
            stopTimer();
            const message = reason === 'time'
                ? `Time's up! Your score: ${score}`
                : `No more moves! Your score: ${score}`;
            showOverlay('Game Over', message);
        }

        function checkGameState() {
            const applesLeft = updateApplesLeft();
            if (applesLeft === 0) {
                handleVictory();
                return;
            }
            if (!checkForMoves()) {
                handleGameOver('nomoves');
            }
        }

        function updateBgmState() {
            bgmToggle.textContent = bgmEnabled ? 'Music: On' : 'Music: Off';
            if (!bgmEnabled) {
                bgm.pause();
                return;
            }
            bgm.volume = 0.4;
            bgm.play().catch(() => {
                // Ignore autoplay restrictions
            });
        }

        // Pointer events for unified mouse/touch handling
        gameBoard.addEventListener('pointerdown', (e) => {
            if (shouldIgnoreTarget(e.target)) {
                return;
            }

            if (e.pointerType === 'mouse' && e.button !== 0) {
                return;
            }

            e.preventDefault();
            activePointerId = e.pointerId;
            updateBgmState();
            if (e.target.setPointerCapture) {
                e.target.setPointerCapture(e.pointerId);
            }
            startSelection(e.clientX, e.clientY);
        }, { passive: false });

        gameBoard.addEventListener('pointermove', (e) => {
            if (!isSelecting || activePointerId !== e.pointerId) return;
            e.preventDefault();
            updateSelection(e.clientX, e.clientY);
        }, { passive: false });

        gameBoard.addEventListener('pointerup', (e) => {
            if (activePointerId !== e.pointerId) return;
            if (e.target.releasePointerCapture) {
                e.target.releasePointerCapture(e.pointerId);
            }
            finishSelection();
            activePointerId = null;
        });

        gameBoard.addEventListener('pointercancel', (e) => {
            if (activePointerId !== e.pointerId) return;
            finishSelection();
            activePointerId = null;
        });

        // Handle window resize - update layout and cached positions
        window.addEventListener('resize', () => {
            if (appleElements.length > 0) {
                updateLayout();
                requestAnimationFrame(() => {
                    cacheApplePositions();
                });
            }
        });

        // Handle scroll - update cached positions
        window.addEventListener('scroll', () => {
            if (appleElements.length > 0) {
                cacheApplePositions();
            }
        });

        overlayRestart.addEventListener('click', () => {
            startGame();
        });

        bgmToggle.addEventListener('click', () => {
            bgmEnabled = !bgmEnabled;
            updateBgmState();
        });

        bgm.addEventListener('ended', () => {
            if (bgmEnabled) {
                setTimeout(() => {
                    bgm.currentTime = 0;
                    bgm.play().catch(() => {
                        // Ignore autoplay restrictions
                    });
                }, 1000);
            }
        });

        // Light color toggle
        lightToggle.addEventListener('change', () => {
            if (lightToggle.checked) {
                document.body.classList.add('light-colors');
            } else {
                document.body.classList.remove('light-colors');
            }
        });

        compactToggle.addEventListener('change', () => {
            setLayout(compactToggle.checked);
        });

        // Register service worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {
                // Silently fail if sw.js doesn't exist yet
            });
        }

        // Auto-start game on load
        const prefersCompact = window.matchMedia('(max-width: 600px)').matches;
        compactToggle.checked = prefersCompact;
        setLayout(prefersCompact, { restart: false });
        updateBgmState();
        startGame();
    </script>
</body>
</html>
